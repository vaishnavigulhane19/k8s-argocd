apiVersion: apps/v1
kind: Deployment
metadata:      
  name: my-deployment
  labels: 
    app: myapp
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        ports:
        - containerPort: 80
